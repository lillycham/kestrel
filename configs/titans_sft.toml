# ~36M parameter Titans-MAG SFT configuration for Colab (L4/A100).
[model]
vocab_size = 16384
hidden_size = 384
intermediate_size = 1024
num_hidden_layers = 12
num_attention_heads = 6
num_key_value_heads = 2
head_dim = 64
max_position_embeddings = 1024
tie_word_embeddings = true
attention_bias = false
attention_dropout = 0.0
rms_norm_eps = 0.000001
rope_theta = 10000.0
memory_chunk_size = 128
memory_hidden_size = 256
attention_window = 256

[train]
steps = 2000
batch_size = 16
sequence_length = 1024
gradient_accumulation = 2
warmup_steps = 100
decay_steps = 600
muon_lr = 0.004
adamw_lr = 0.0002
weight_decay = 0.01
clip_norm = 1.0
eval_every = 100
eval_batches = 16
save_every = 500
seed = 42
precision = "auto"
compile = true
assistant_only = true
