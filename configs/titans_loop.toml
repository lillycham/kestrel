# ~34M unique / 14-effective-layer Looped Titans-MAG configuration (prelude + 3x4 core + coda, 4-head memory).
[model]
vocab_size = 16384
hidden_size = 512
intermediate_size = 1408
num_hidden_layers = 4
num_attention_heads = 8
num_key_value_heads = 2
head_dim = 64
max_position_embeddings = 1024
tie_word_embeddings = true
attention_bias = false
attention_dropout = 0.0
rms_norm_eps = 0.000001
rope_theta = 10000.0
memory_chunk_size = 64
memory_hidden_size = 512
memory_heads = 4
memory_forget_bias = 0.0
memory_min_forget = 0.02
norm_attn_branch = true
attention_window = 256
prelude_layers = 1
num_loops = 3
coda_layers = 1

[train]
steps = 25000
batch_size = 8
sequence_length = 1024
gradient_accumulation = 4
warmup_steps = 500
decay_steps = 5000
muon_lr = 0.02
adamw_lr = 0.001
weight_decay = 0.01
clip_norm = 1.0
eval_every = 250
eval_batches = 16
save_every = 1000
keep_checkpoints = true
seed = 42
precision = "auto"
compile = true
