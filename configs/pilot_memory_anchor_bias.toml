# Memory pilot (fix plus the code-default forget bias of -2) on TinyStories: a small Looped Titans-MAG with the
# titans-loop-1 memory settings. The attention window (64) is shorter than a
# story, so the memory has work to do. Compare the memory/* metrics and a
# nowrite ablation (scripts/memory_probes.py) across the three pilot configs.
[model]
vocab_size = 4096
hidden_size = 128
intermediate_size = 448
num_hidden_layers = 2
num_attention_heads = 4
num_key_value_heads = 2
head_dim = 32
max_position_embeddings = 512
tie_word_embeddings = true
attention_bias = false
attention_dropout = 0.0
rms_norm_eps = 0.000001
rope_theta = 10000.0
memory_chunk_size = 32
memory_hidden_size = 128
memory_heads = 4
memory_forget_bias = -2.0
memory_min_forget = 0.02
memory_decay_to_init = true
norm_attn_branch = true
attention_window = 64
prelude_layers = 1
num_loops = 3
coda_layers = 1

[train]
steps = 2000
batch_size = 64
sequence_length = 512
gradient_accumulation = 1
warmup_steps = 100
decay_steps = 400
muon_lr = 0.02
adamw_lr = 0.002
weight_decay = 0.01
clip_norm = 1.0
eval_every = 100
eval_batches = 16
save_every = 500
seed = 42
precision = "auto"
compile = false  # A whole-model compile takes ~14 min here, longer than the training.
