# ~31M parameter Titans-MAG pretraining configuration (2048 context, 256 local window + chunked neural memory).
[model]
vocab_size = 16384
hidden_size = 384
intermediate_size = 1024
num_hidden_layers = 12
num_attention_heads = 6
num_key_value_heads = 2
head_dim = 64
max_position_embeddings = 2048
tie_word_embeddings = true
attention_bias = false
attention_dropout = 0.0
rms_norm_eps = 0.000001
rope_theta = 10000.0
memory_chunk_size = 64
memory_hidden_size = 256
attention_window = 256

[train]
steps = 20000
batch_size = 8
sequence_length = 2048
gradient_accumulation = 2
warmup_steps = 400
decay_steps = 4000
muon_lr = 0.02
adamw_lr = 0.001
weight_decay = 0.01
clip_norm = 1.0
eval_every = 250
eval_batches = 16
save_every = 500
seed = 42
precision = "auto"
compile = true
