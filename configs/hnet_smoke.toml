# Fast CPU smoke config for a byte-level H-Net with a transformer main network.
[model]
architecture = "hnet"
vocab_size = 264
hidden_size = 32
intermediate_size = 64
num_attention_heads = 4
num_key_value_heads = 2
head_dim = 8
max_position_embeddings = 64
tie_word_embeddings = true
attention_bias = false
attention_dropout = 0.0
rms_norm_eps = 0.000001
rope_theta = 10000.0
attention_window = 8
encoder_layers = 1
decoder_layers = 1
target_chunk_size = 4.0
ratio_loss_weight = 0.03

[model.main]
network = "transformer"
hidden_size = 48
intermediate_size = 96
num_hidden_layers = 2
num_attention_heads = 4
num_key_value_heads = 2
head_dim = 12

[train]
steps = 4
batch_size = 2
sequence_length = 48
gradient_accumulation = 1
warmup_steps = 1
decay_steps = 2
muon_lr = 0.02
adamw_lr = 0.002
weight_decay = 0.01
clip_norm = 1.0
eval_every = 2
eval_batches = 2
save_every = 2
seed = 7
